<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل البث</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        h1 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #00d4ff;
        }
        video {
            width: 100%;
            max-width: 900px;
            background: #111;
            border-radius: 8px;
            aspect-ratio: 16/9;
        }
        .status {
            margin-top: 15px;
            padding: 10px 20px;
            background: #1a1a1a;
            border-radius: 8px;
            font-size: 14px;
        }
        .status.ok { color: #4caf50; }
        .status.err { color: #f44336; }
    </style>
</head>
<body>
    <h1>🎬 مشغل البث</h1>
    
    <video id="video" controls autoplay muted playsinline></video>
    
    <div id="status" class="status">جارٍ التحميل…</div>

    <script>
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        
        // ⚠️ رابط البث بتاعك
        const STREAM_URL = 'https://alw09.alhndyalsyrfr19.workers.dev/alwan1.playlist.m3u8?token=MySecret123';

        function setStatus(msg, type) {
            status.textContent = msg;
            status.className = 'status ' + (type || '');
        }

        if (Hls.isSupported()) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: false,
                backBufferLength: 30,
            });

            hls.loadSource(STREAM_URL);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                setStatus('✅ جاهز للتشغيل — اضغط زر Play', 'ok');
                video.play().catch(() => {
                    setStatus('اضغط على الفيديو للتشغيل', '');
                });
            });

            hls.on(Hls.Events.ERROR, (event, data) => {
                console.error(data);
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            setStatus('❌ خطأ شبكة — إعادة محاولة…', 'err');
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            setStatus('❌ خطأ في الوسائط — إعادة محاولة…', 'err');
                            hls.recoverMediaError();
                            break;
                        default:
                            setStatus('❌ خطأ غير متوقع', 'err');
                            hls.destroy();
                            break;
                    }
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Safari على iOS
            video.src = STREAM_URL;
            setStatus('✅ جاهز — اضغط زر Play', 'ok');
        } else {
            setStatus('❌ المتصفح لا يدعم تشغيل HLS', 'err');
        }
    </script>
</body>
</html>
